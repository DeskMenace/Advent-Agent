name: Dependency review
# NOTE: the dependency graph / dependency review on a PRIVATE repository needs GitHub Advanced Security.
# Until the repository is public this job fails or is skipped; that is expected.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    # Code scanning and dependency review need GitHub Advanced Security on private repos (not on the Free plan), so they run once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
