name: CodeQL
# NOTE: code scanning on a PRIVATE repository needs GitHub Advanced Security. Until the repository is public this
# workflow is skipped or fails at the upload step; that is expected and goes away once the repo is public.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning and dependency review need GitHub Advanced Security on private repos (not on the Free plan), so they run once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
