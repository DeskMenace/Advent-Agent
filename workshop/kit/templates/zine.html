<style>
:root{--cream:#F7F2E9;--milk:#FFFAF0;--ink:#243A32;--green:#14503A;--red:#A82438;--gold:#BD955A;--gold-light:#E7C890;--line:#DFD7C9;--muted:#766F62}
html,body{margin:0;background:var(--cream);color:var(--ink);font:18px/1.55 Georgia,serif}
.reader{max-width:560px;margin:24px auto;padding:0 16px}
.zp{background:var(--milk);border:1px solid var(--line);border-radius:4px;padding:36px 32px;min-height:60vh;box-shadow:0 6px 24px rgba(36,58,50,.1)}
.zp[hidden]{display:none}.zp h1{font-weight:400;font-size:34px;margin:0 0 12px}.zp h2{font-weight:400;font-size:24px;margin:0 0 10px}
.num{font:600 12px/1 system-ui,sans-serif;letter-spacing:.14em;color:var(--red);text-transform:uppercase}
nav{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:12px;font:15px system-ui,sans-serif;color:var(--muted)}
button{font:600 15px/1 system-ui,sans-serif;padding:10px 16px;border-radius:6px;border:1px solid var(--gold);background:var(--green);color:var(--milk);cursor:pointer;min-width:44px;min-height:44px}
button:disabled{opacity:.4}button:focus-visible{outline:3px solid var(--gold-light);outline-offset:2px}
.sheet{display:none}
@page{size:A4 landscape;margin:5mm}
@media print{
  html,body{background:#fff}.reader{display:none}
  .sheet{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);width:287mm;height:200mm}
  .sheet .zp{display:block!important;min-height:0;border:.2mm dashed #bbb;border-radius:0;box-shadow:none;padding:6mm;overflow:hidden;font-size:9.5pt;margin:0}
  .sheet .zp h1{font-size:18pt}.sheet .zp h2{font-size:13pt}.top{transform:rotate(180deg)}
}
/* Capture: the calendar calls window.adventCapture.prepare(kind) at 1080×1350 (still) or 1080×1920 (loop). Keep the bottom-right 160×48 px clear for the share mark. */
.is-capturing nav,.is-capturing main>p{display:none}
</style>
</head>
<body>
<main class="reader" aria-label="Zine reader">
  <div id="pages">
    <!-- TODO: exactly 8 pages. Page 1 is the cover, page 8 the back. -->
    <article class="zp" data-page="1"><p class="num">Cover</p><h1>TODO: Zine title</h1><p>TODO: subtitle.</p></article>
    <article class="zp" data-page="2" hidden><p class="num">2</p><h2>TODO</h2><p>TODO</p></article>
    <article class="zp" data-page="3" hidden><p class="num">3</p><h2>TODO</h2><p>TODO</p></article>
    <article class="zp" data-page="4" hidden><p class="num">4</p><h2>TODO</h2><p>TODO</p></article>
    <article class="zp" data-page="5" hidden><p class="num">5</p><h2>TODO</h2><p>TODO</p></article>
    <article class="zp" data-page="6" hidden><p class="num">6</p><h2>TODO</h2><p>TODO</p></article>
    <article class="zp" data-page="7" hidden><p class="num">7</p><h2>TODO</h2><p>TODO</p></article>
    <article class="zp" data-page="8" hidden><p class="num">Back</p><h2>TODO: colophon</h2><p>TODO: a last line.</p></article>
  </div>
  <nav><button type="button" id="prev" aria-label="Previous page">‹</button><span id="status" aria-live="polite">1 / 8</span><button type="button" id="next" aria-label="Next page">›</button><button type="button" id="print">Print</button></nav>
  <p style="font:14px system-ui,sans-serif;color:var(--muted);text-align:center">Print on one A4 sheet (landscape), cut the slit along the middle between the inner four panels, fold into a booklet.</p>
</main>
<div class="sheet" id="sheet" aria-hidden="true"></div>
<script>
(function(){
  var pages=[].slice.call(document.querySelectorAll('#pages .zp')),i=0,prev=document.getElementById('prev'),next=document.getElementById('next'),status=document.getElementById('status');
  function go(n){i=Math.max(0,Math.min(pages.length-1,n));pages.forEach(function(p,k){p.hidden=k!==i});status.textContent=(i+1)+' / '+pages.length;prev.disabled=i===0;next.disabled=i===pages.length-1;}
  prev.onclick=function(){go(i-1)};next.onclick=function(){go(i+1)};
  window.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}});
  // Fold layout (8-page one-sheet zine): grid positions hold pages 8 1 2 7 (top row, upside down) / 6 3 4 5 (bottom row).
  var order=[8,1,2,7,6,3,4,5],sheet=document.getElementById('sheet');
  function buildSheet(){sheet.innerHTML='';order.forEach(function(n,k){var src=pages[n-1];if(!src)return;var c=src.cloneNode(true);c.hidden=false;if(k<4)c.classList.add('top');sheet.appendChild(c);});}
  document.getElementById('print').onclick=function(){buildSheet();window.print()};window.addEventListener('beforeprint',buildSheet);
  go(0);
  // Share frame: the cover (loop: page through).
  window.adventCapture={async prepare(kind){
    document.documentElement.classList.add('is-capturing');go(0);
    if(kind==='loop'){var k=0;var t=setInterval(function(){k++;if(k>=pages.length){clearInterval(t);return;}go(k);},900);}
    await new Promise(function(r){setTimeout(r,200)});
  }};
})();
</script>
</body>
