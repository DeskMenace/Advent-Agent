<style>
:root{--cream:#F7F2E9;--milk:#FFFAF0;--ink:#243A32;--green:#14503A;--green-dark:#0D3829;--red:#A82438;--gold:#BD955A;--gold-light:#E7C890;--frame:#26302A;--line:#DFD7C9;--muted:#766F62}
html,body{margin:0;min-height:100%;background:var(--cream);display:grid;place-items:center;font:16px/1.4 system-ui,sans-serif;color:var(--ink)}
.scene{perspective:1000px;padding:24px}
.tc{width:min(320px,86vw);aspect-ratio:63/88;background:linear-gradient(160deg,var(--milk),#efe6d4);border:10px solid var(--frame);border-radius:14px;box-shadow:0 20px 50px rgba(36,58,50,.25);display:grid;grid-template-rows:auto 1fr auto auto;overflow:hidden;transition:transform .15s ease;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0))}
.head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 6px;border-bottom:2px solid var(--gold)}
.head h1{font:400 22px/1 Georgia,serif;margin:0}.rarity{font:600 11px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.art{margin:10px 14px;border:2px solid var(--gold);background:var(--green);display:grid;place-items:center;overflow:hidden}.art svg{width:100%;height:100%}
.flavour{margin:0 14px;font:italic 13px/1.4 Georgia,serif;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 14px 14px}
.stat{background:var(--milk);border:1px solid var(--line);border-radius:6px;text-align:center;padding:6px 4px}
.stat b{display:block;font:600 20px/1 Georgia,serif;color:var(--green-dark)}.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.holo{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(231,200,144,.35) 50%,transparent 70%);mix-blend-mode:screen;opacity:var(--holo,0)}
.wrap{position:relative}
@media (prefers-reduced-motion:reduce){.tc{transition:none;transform:none!important}.holo{display:none}}
@media print{html,body{background:#fff}.tc{box-shadow:none}}
/* Capture: the calendar calls window.adventCapture.prepare(kind) at 1080×1350 (still) or 1080×1920 (loop). Keep the bottom-right 160×48 px clear for the share mark. */
.is-capturing .tc{transition:none}
</style>
</head>
<body>
<div class="scene"><div class="wrap">
<article class="tc" id="card" aria-label="Trading card">
  <header class="head"><h1>TODO: Name</h1><span class="rarity">TODO: Rarity</span></header>
  <div class="art" role="img" aria-label="TODO: alt text">
    <!-- TODO: original SVG portrait -->
    <svg viewBox="0 0 200 200"><rect width="200" height="200" fill="#14503A"/><circle cx="100" cy="90" r="50" fill="#E7C890"/><rect x="60" y="140" width="80" height="40" rx="8" fill="#A82438"/></svg>
  </div>
  <p class="flavour">"TODO: one line of flavour text, a joke grounded in a shared fact."</p>
  <div class="stats">
    <div class="stat"><b>TODO</b><span>Stat 1</span></div>
    <div class="stat"><b>TODO</b><span>Stat 2</span></div>
    <div class="stat"><b>TODO</b><span>Stat 3</span></div>
  </div>
</article><div class="holo" id="holo"></div></div></div>
<script>
(function(){
  var card=document.getElementById('card'),holo=document.getElementById('holo'),reduced=false;
  // Share frame: the card tilted so the foil catches the light (loop: a slow tilt sweep).
  window.adventCapture={async prepare(kind){
    document.documentElement.classList.add('is-capturing');
    function tilt(x){card.style.setProperty('--ry',(x*14)+'deg');card.style.setProperty('--rx','-4deg');holo.style.setProperty('--holo',String(0.5+x));}
    tilt(0.4);
    if(kind==='loop'){var t0=performance.now();(function f(){var t=(performance.now()-t0)/1000;tilt(0.45*Math.sin(t*1.2));if(t<10)requestAnimationFrame(f);})();}
    await new Promise(function(r){setTimeout(r,300)});
  }};
  try{reduced=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  if(reduced)return;
  card.addEventListener('pointermove',function(e){var r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-0.5,y=(e.clientY-r.top)/r.height-0.5;card.style.setProperty('--ry',(x*14)+'deg');card.style.setProperty('--rx',(-y*14)+'deg');holo.style.setProperty('--holo',String(0.5+x));});
  card.addEventListener('pointerleave',function(){card.style.setProperty('--ry','0deg');card.style.setProperty('--rx','0deg');holo.style.setProperty('--holo','0');});
})();
</script>
</body>
</html>
