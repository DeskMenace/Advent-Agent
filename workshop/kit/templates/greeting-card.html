<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TODO: Card title</title>
<!-- Advent Agent template: greeting card (front + inside, print-ready). Everything inline. No network. MIT. -->
<script type="application/advent-gift+json">
{
  "schema": "advent-agent/gift@2",
  "day": 0,
  "title": "TODO: Card title",
  "ideaId": null,
  "family": "paper-and-pop-ups",
  "emotion": "TODO: one of funny | ridiculous | absurd | cute | touching",
  "interaction": ["open"],
  "form": "interactive-html",
  "tierUsed": "S",
  "note": "TODO: two to four warm, specific sentences: why you made this for them. No stock phrases.",
  "share": {"still": {"capture": "still"}, "caption": "TODO: one line they might post with it, in their language", "privateText": []},
  "continuity": {"motifs": []},
  "downloads": [],
  "credits": [],
  "incomplete": []
}
</script>
<style>
:root{--cream:#F7F2E9;--milk:#FFFAF0;--ink:#243A32;--green:#14503A;--green-dark:#0D3829;--red:#A82438;--gold:#BD955A;--gold-light:#E7C890;--line:#DFD7C9;--muted:#766F62}
html,body{margin:0;background:var(--cream);color:var(--ink);font:18px/1.6 Georgia,'Iowan Old Style',serif}
.card{max-width:560px;margin:24px auto;padding:0 16px}
.face{background:var(--milk);border:1px solid var(--line);border-radius:6px;padding:40px 36px;min-height:420px;box-shadow:0 6px 24px rgba(36,58,50,.12);display:flex;flex-direction:column;justify-content:center;text-align:center}
.face[hidden]{display:none}
.eyebrow{font:600 12px/1 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin:0 0 16px}
h1{font-size:clamp(28px,6vw,44px);font-weight:400;margin:0;line-height:1.1;color:var(--green-dark)}
.inside{text-align:left}.inside p{margin:0 0 1em}.sign{font-style:italic;text-align:right}
.art{margin:0 auto 20px;max-width:100%}
button{font:600 16px/1 system-ui,sans-serif;padding:12px 18px;border-radius:6px;border:1px solid var(--gold);background:var(--green);color:var(--milk);cursor:pointer;min-height:44px;display:block;margin:16px auto 0}
button:focus-visible{outline:3px solid var(--gold-light);outline-offset:2px}
@page{size:A4;margin:12mm}
@media print{html,body{background:#fff}.face[hidden]{display:flex!important}.face{box-shadow:none;border:none;page-break-after:always}.no-print{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Capture: the calendar calls window.adventCapture.prepare(kind) at 1080×1350 (still) or 1080×1920 (loop). Keep the bottom-right 160×48 px clear for the share mark. */
.is-capturing #flip{display:none}
</style>
</head>
<body>
<article class="card" aria-label="Greeting card">
  <section class="face front">
    <p class="eyebrow">TODO: eyebrow (e.g. "Door 7")</p>
    <div class="art" aria-hidden="true">
      <!-- TODO: original SVG art, 3–5 colours. Example: -->
      <svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="TODO: alt text"><circle cx="100" cy="100" r="80" fill="#14503A"/><circle cx="100" cy="92" r="46" fill="#F7F2E9"/><circle cx="100" cy="92" r="12" fill="#A82438"/></svg>
    </div>
    <h1>TODO: Front title</h1>
  </section>
  <section class="face inside" hidden>
    <!-- Names and places: data-advent-private lets the privacy preview blur them before sharing. -->
    <h2 style="font-weight:400;font-size:26px;margin:0 0 12px" data-advent-private>TODO: Dear …,</h2>
    <p>TODO: first paragraph: what this is and why.</p>
    <p>TODO: second paragraph: one specific, true detail.</p>
    <p class="sign">TODO: Your Secret Santa</p>
  </section>
  <button type="button" class="no-print" id="flip">Open the card</button>
</article>
<script>
(function(){
  var front=document.querySelector('.front'),inside=document.querySelector('.inside'),btn=document.getElementById('flip');
  btn.addEventListener('click',function(){var open=inside.hidden;inside.hidden=!open;front.hidden=open;btn.textContent=open?'Close the card':'Open the card';});
})();
// Share frame: the card opened, inside visible, button hidden.
window.adventCapture={async prepare(kind){
  document.documentElement.classList.add('is-capturing');
  document.querySelector('.front').hidden=true;document.querySelector('.inside').hidden=false;
  await new Promise(function(r){setTimeout(r,300)});
}};
</script>
</body>
</html>
