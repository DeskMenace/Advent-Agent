<style>
:root{--cream:#F7F2E9;--milk:#FFFAF0;--ink:#243A32;--green:#14503A;--green-dark:#0D3829;--red:#A82438;--gold:#BD955A;--gold-light:#E7C890;--line:#DFD7C9;--muted:#766F62}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font:clamp(18px,2.4vw,28px)/1.4 Georgia,serif}
.deck{height:100%;display:grid;grid-template-rows:1fr auto}
.slide{display:none;padding:6vh 8vw;box-sizing:border-box;background:var(--milk);margin:16px;border:1px solid var(--line);border-radius:6px;overflow:auto}
.slide.is-current{display:flex;flex-direction:column;justify-content:center}
.slide h1{font-weight:400;font-size:2.2em;margin:0 0 .3em;color:var(--green-dark)}.slide h2{font-weight:400;font-size:1.6em;margin:0 0 .4em}
.slide p,.slide li{max-width:36ch}.eyebrow{font:600 .5em/1 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
nav{display:flex;justify-content:center;align-items:center;gap:12px;padding:8px 16px 16px;font:15px system-ui,sans-serif;color:var(--muted)}
button{font:600 15px/1 system-ui,sans-serif;padding:10px 16px;border-radius:6px;border:1px solid var(--gold);background:var(--green);color:var(--milk);cursor:pointer;min-width:44px;min-height:44px}
button:disabled{opacity:.4}button:focus-visible{outline:3px solid var(--gold-light);outline-offset:2px}
@page{size:A4 landscape;margin:10mm}
@media print{html,body{background:#fff}.slide{display:flex!important;flex-direction:column;justify-content:center;page-break-after:always;min-height:180mm;border:none;margin:0}nav{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Capture: the calendar calls window.adventCapture.prepare(kind) at 1080×1350 (still) or 1080×1920 (loop). Keep the bottom-right 160×48 px clear for the share mark. */
.is-capturing nav{display:none}
</style>
</head>
<body>
<main class="deck" id="deck" aria-roledescription="slideshow">
  <!-- TODO: one <section class="slide"> per slide. Keep 6–12 slides. -->
  <section class="slide is-current"><p class="eyebrow">TODO: eyebrow</p><h1>TODO: Title slide</h1><p>TODO: one line.</p></section>
  <section class="slide"><h2>TODO: Slide two</h2><ul><li>TODO</li><li>TODO</li></ul></section>
  <section class="slide"><h2>TODO: Last slide</h2><p>TODO: a closing line.</p></section>
  <nav aria-label="Slides">
    <button type="button" id="prev" aria-label="Previous slide">‹</button>
    <span id="status" aria-live="polite">1 / 3</span>
    <button type="button" id="next" aria-label="Next slide">›</button>
    <button type="button" id="print" title="P">Print / PDF</button>
  </nav>
</main>
<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide')),i=0,prev=document.getElementById('prev'),next=document.getElementById('next'),status=document.getElementById('status');
  function go(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach(function(s,k){s.classList.toggle('is-current',k===i);s.setAttribute('aria-hidden',k!==i);});status.textContent=(i+1)+' / '+slides.length;prev.disabled=i===0;next.disabled=i===slides.length-1;}
  prev.onclick=function(){go(i-1)};next.onclick=function(){go(i+1)};document.getElementById('print').onclick=function(){window.print()};
  window.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);else if(e.key==='p'||e.key==='P')window.print();});
  var sx=null;document.addEventListener('pointerdown',function(e){sx=e.clientX});document.addEventListener('pointerup',function(e){if(sx==null)return;var dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40)go(dx<0?i+1:i-1)});
  go(0);
  // Share frame: the title slide (loop: step through the slides).
  window.adventCapture={async prepare(kind){
    document.documentElement.classList.add('is-capturing');go(0);
    if(kind==='loop'){var k=0;var t=setInterval(function(){k++;if(k>=slides.length){clearInterval(t);return;}go(k);},1500);}
    await new Promise(function(r){setTimeout(r,200)});
  }};
})();
</script>
</body>
