<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snow globe</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#e9f3f0,#c5d9d2 48%,#96b2a9);font-family:Georgia,serif;color:#14503a}button{font:inherit}.globe{width:min(70vw,320px);aspect-ratio:1;border:6px solid #fffbf0;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 38% 31%,#f5f8ed,#b4d2ca 65%,#7faca2);box-shadow:inset -18px -15px 35px #3d6f6550,inset 10px 9px 28px #ffffffb3,0 15px 32px #48685d45;cursor:pointer}.hill{position:absolute;bottom:0;height:22%;left:-20%;width:140%;border-radius:50% 50% 0 0;background:#fdf8e9}.tree{position:absolute;bottom:14%;left:50%;transform:translateX(-50%);font-size:min(30vw,120px);line-height:1}.stand{width:55%;height:46px;margin:-3px auto 16px;border-radius:8px 8px 35% 35%;background:linear-gradient(#ae6b54,#7c443b);display:grid;place-items:center;color:#f0cf99;font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-family:Arial,sans-serif}.row{display:flex;gap:10px;justify-content:center}.btn{border:1px solid #14503a;background:#14503a;color:#fffbee;border-radius:5px;padding:12px 18px;cursor:pointer;min-height:44px}.btn.alt{background:transparent;color:#14503a}canvas{position:absolute;inset:0;width:100%;height:100%}@media (prefers-reduced-motion:reduce){.globe.shaking{animation:none}}@keyframes shake{20%,60%{transform:rotate(-7deg)}40%,80%{transform:rotate(7deg)}}.shaking{animation:shake .6s ease}</style></head><body><main><div class="globe" id="globe" role="button" tabindex="0" aria-label="Snow globe. Press to shake."><canvas id="c" aria-hidden="true"></canvas><div class="hill"></div><div class="tree" aria-hidden="true">🌲</div></div><div class="stand">A little winter</div><div class="row"><button class="btn" id="shake">Shake the globe</button><button class="btn alt" id="reset">Reset</button></div><p id="count" aria-live="polite" style="text-align:center;font-style:italic">0 shakes</p></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let flakes=[],energy=0,shakes=0,raf;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio}size();addEventListener('resize',size);
function spawn(n){for(let i=0;i<n;i++)flakes.push({x:Math.random()*c.width,y:Math.random()*c.height,r:(1+Math.random()*3)*devicePixelRatio,v:(0.3+Math.random())*devicePixelRatio,d:Math.random()*6.28})}
function reset(){flakes=[];energy=0;shakes=0;spawn(60);document.getElementById('count').textContent='0 shakes';draw()}
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';for(const f of flakes){ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.28);ctx.fill();if(!reduced){f.y+=f.v*(1+energy);f.x+=Math.sin(f.d+=0.02)*0.6*devicePixelRatio;if(f.y>c.height){f.y=-5;f.x=Math.random()*c.width}}}energy*=0.985;if(!reduced)raf=requestAnimationFrame(draw)}
function shake(){shakes++;energy=Math.min(6,energy+3);spawn(40);if(flakes.length>400)flakes.splice(0,flakes.length-400);const g=document.getElementById('globe');g.classList.remove('shaking');void g.offsetWidth;g.classList.add('shaking');document.getElementById('count').textContent=shakes+' shake'+(shakes===1?'':'s');if(reduced)draw()}
document.getElementById('shake').onclick=shake;document.getElementById('reset').onclick=reset;const g=document.getElementById('globe');g.onclick=shake;g.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();shake()}};reset();
window.adventCapture={async prepare(kind){shake();if(kind==='still'){await new Promise(r=>setTimeout(r,700))}}};
</script></body></html>
